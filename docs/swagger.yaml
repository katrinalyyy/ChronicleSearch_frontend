basePath: /
definitions:
  Lab1_intermal_app_ds.ChronicleResource:
    properties:
      author:
        type: string
      date_of_creation:
        type: string
      detailed_description:
        type: string
      detailed_editions:
        type: string
      detailed_significance:
        type: string
      id:
        type: integer
      image:
        type: string
      location:
        type: string
      time_of_action:
        type: string
      title:
        type: string
    type: object
  Lab1_intermal_app_ds.RequestChronicleResearch:
    properties:
      completed_at:
        $ref: '#/definitions/sql.NullTime'
      created_at:
        type: string
      creator:
        $ref: '#/definitions/Lab1_intermal_app_ds.User'
      formed_at:
        $ref: '#/definitions/sql.NullTime'
      id:
        type: integer
      moderator:
        $ref: '#/definitions/Lab1_intermal_app_ds.User'
      name:
        type: string
      search_event:
        type: string
      status:
        $ref: '#/definitions/Lab1_intermal_app_ds.RequestStatus'
    type: object
  Lab1_intermal_app_ds.RequestStatus:
    enum:
    - черновик
    - удалён
    - сформирован
    - завершён
    - отклонён
    type: string
    x-enum-varnames:
    - RequestStatusDraft
    - RequestStatusDeleted
    - RequestStatusFormed
    - RequestStatusCompleted
    - RequestStatusRejected
  Lab1_intermal_app_ds.User:
    properties:
      name:
        type: string
      pass:
        type: string
      role:
        $ref: '#/definitions/Lab1_intermal_app_role.Role'
      uuid:
        type: string
    type: object
  Lab1_intermal_app_role.Role:
    enum:
    - 0
    - 1
    type: integer
    x-enum-comments:
      Moderator: 1 - Модератор (администратор)
      Researcher: 0 - Исследователь (обычный пользователь)
    x-enum-descriptions:
    - 0 - Исследователь (обычный пользователь)
    - 1 - Модератор (администратор)
    x-enum-varnames:
    - Researcher
    - Moderator
  intermal_app_handler.loginReq:
    properties:
      login:
        example: max
        type: string
      password:
        example: "123"
        type: string
    type: object
  intermal_app_handler.loginResp:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 3600000000000
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  intermal_app_handler.registerReq:
    properties:
      name:
        example: testuser
        type: string
      pass:
        example: password123
        type: string
    type: object
  intermal_app_handler.registerResp:
    properties:
      ok:
        example: true
        type: boolean
    type: object
  sql.NullTime:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@chroniclesearch.ru
    name: API Support
  description: REST API для системы поиска и управления историческими хрониками
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: ChronicleSearch API
  version: "1.0"
paths:
  /api/ChronicleRequestList:
    get:
      consumes:
      - application/json
      description: Получить список заявок (для пользователя - только свои, для модератора
        - все)
      parameters:
      - description: Фильтр по статусу
        in: query
        name: status
        type: string
      - description: Дата начала (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Дата окончания (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Получить список заявок
      tags:
      - ChronicleRequestList
  /api/ChronicleRequestList/{id_chronicle_request}:
    delete:
      consumes:
      - application/json
      description: Удаление заявки (требуется авторизация, только создатель)
      parameters:
      - description: ID заявки
        in: path
        name: id_chronicle_request
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Удалить заявку
      tags:
      - ChronicleRequestList
    get:
      consumes:
      - application/json
      description: Получить детальную информацию о заявке со списком хроник (требуется
        авторизация)
      parameters:
      - description: ID заявки
        in: path
        name: id_chronicle_request
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Получить заявку с хрониками
      tags:
      - ChronicleRequestList
    put:
      consumes:
      - application/json
      description: Обновление полей заявки (требуется авторизация)
      parameters:
      - description: ID заявки
        in: path
        name: id_chronicle_request
        required: true
        type: integer
      - description: Обновленные данные заявки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Lab1_intermal_app_ds.RequestChronicleResearch'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Обновить заявку
      tags:
      - ChronicleRequestList
  /api/ChronicleRequestList/{id_chronicle_request}/chronicle_complete-or-reject:
    put:
      consumes:
      - application/json
      description: Завершение или отклонение заявки (только для модератора)
      parameters:
      - description: ID заявки
        in: path
        name: id_chronicle_request
        required: true
        type: integer
      - description: 'Действие: complete или reject'
        in: body
        name: action
        required: true
        schema:
          properties:
            action:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "403":
          description: error - не модератор
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Завершить или отклонить заявку
      tags:
      - ChronicleRequestList
  /api/ChronicleRequestList/{id_chronicle_request}/chronicle_request-form:
    put:
      consumes:
      - application/json
      description: Формирование заявки из черновика (требуется авторизация, только
        создатель)
      parameters:
      - description: ID заявки
        in: path
        name: id_chronicle_request
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Сформировать заявку
      tags:
      - ChronicleRequestList
  /api/ChronicleRequestList/chronicle_draft:
    get:
      consumes:
      - application/json
      description: Получить ID черновика заявки и количество хроник в нем (для неавторизованных
        возвращает пустую корзину)
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      summary: Получить информацию о черновике заявки
      tags:
      - ChronicleRequestList
  /api/chronicle_research/{id}/chronicles/{chronicle_id}:
    delete:
      consumes:
      - application/json
      description: Удаление хроники из заявки (требуется авторизация)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: ID хроники
        in: path
        name: chronicle_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Удалить хронику из заявки
      tags:
      - chronicle_research
    put:
      consumes:
      - application/json
      description: Обновление количества, порядка или других полей связи хроники с
        заявкой (требуется авторизация)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: ID хроники
        in: path
        name: chronicle_id
        required: true
        type: integer
      - description: Обновляемые поля (quantity, order, etc.)
        in: body
        name: updates
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Обновить хронику в заявке
      tags:
      - chronicle_research
  /api/chronicle_resources:
    get:
      consumes:
      - application/json
      description: Получить список всех хроник с возможностью фильтрации по названию,
        автору и локации
      parameters:
      - description: Фильтр по названию
        in: query
        name: title
        type: string
      - description: Фильтр по автору
        in: query
        name: author
        type: string
      - description: Фильтр по локации
        in: query
        name: location
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "500":
          description: error
          schema:
            additionalProperties: true
            type: object
      summary: Получить список хроник
      tags:
      - chronicle_resources
    post:
      consumes:
      - application/json
      description: Создание новой хроники (требуется авторизация)
      parameters:
      - description: Данные хроники
        in: body
        name: chronicle
        required: true
        schema:
          $ref: '#/definitions/Lab1_intermal_app_ds.ChronicleResource'
      produces:
      - application/json
      responses:
        "201":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Создать хронику
      tags:
      - chronicle_resources
  /api/chronicle_resources/{id_chronicle_resource}:
    delete:
      consumes:
      - application/json
      description: Удаление хроники по ID (требуется авторизация)
      parameters:
      - description: ID хроники
        in: path
        name: id_chronicle_resource
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Удалить хронику
      tags:
      - chronicle_resources
    get:
      consumes:
      - application/json
      description: Получить детальную информацию о хронике по идентификатору
      parameters:
      - description: ID хроники
        in: path
        name: id_chronicle_resource
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      summary: Получить хронику по ID
      tags:
      - chronicle_resources
    put:
      consumes:
      - application/json
      description: Обновление существующей хроники (требуется авторизация)
      parameters:
      - description: ID хроники
        in: path
        name: id_chronicle_resource
        required: true
        type: integer
      - description: Обновленные данные хроники
        in: body
        name: chronicle
        required: true
        schema:
          $ref: '#/definitions/Lab1_intermal_app_ds.ChronicleResource'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Обновить хронику
      tags:
      - chronicle_resources
  /api/chronicle_resources/{id_chronicle_resource}/add_to_chronicle_request:
    post:
      consumes:
      - application/json
      description: Добавление хроники в черновик заявки (требуется авторизация)
      parameters:
      - description: ID хроники
        in: path
        name: id_chronicle_resource
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Добавить хронику в заявку
      tags:
      - chronicle_resources
  /api/chronicle_resources/{id_chronicle_resource}/image:
    post:
      consumes:
      - multipart/form-data
      description: Загрузка изображения для хроники (требуется авторизация)
      parameters:
      - description: ID хроники
        in: path
        name: id_chronicle_resource
        required: true
        type: integer
      - description: Изображение
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Загрузить изображение хроники
      tags:
      - chronicle_resources
  /api/user/profile:
    get:
      consumes:
      - application/json
      description: Получение данных профиля текущего авторизованного пользователя
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Получить профиль пользователя
      tags:
      - user
    put:
      consumes:
      - application/json
      description: Обновление данных профиля текущего авторизованного пользователя
        (имя, пароль)
      parameters:
      - description: Обновленные данные профиля
        in: body
        name: profile
        required: true
        schema:
          properties:
            name:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Обновить профиль пользователя
      tags:
      - user
  /login:
    post:
      consumes:
      - application/json
      description: Аутентификация пользователя и получение JWT токена
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/intermal_app_handler.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/intermal_app_handler.loginResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход пользователя
      tags:
      - auth
  /logout:
    post:
      consumes:
      - application/json
      description: Добавление JWT токена в блеклист (logout)
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Выход пользователя
      tags:
      - auth
  /sign_up:
    post:
      consumes:
      - application/json
      description: Создание нового пользователя с ролью Исследователь
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/intermal_app_handler.registerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/intermal_app_handler.registerResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация нового пользователя
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer {токен}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
